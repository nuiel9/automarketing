[project]
name = "automarketing"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "authlib>=1.3",
  "anthropic>=0.40",
  "google-genai>=1.0",
  "pyyaml>=6.0",
  "google-cloud-storage>=2.18",
  "google-cloud-run>=0.10",
  "python-multipart>=0.0.9",
  "playwright>=1.62,<2",
  # Thai word segmentation. Neither renderer can find Thai word
  # boundaries on its own: libass has no segmentation at all, and
  # Chromium only segments when its ICU build ships Thai break data
  # (the render image's does not -- the same tips card wrapped
  # correctly on macOS and split a word in half in production).
  "pythainlp>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "aiosqlite>=0.20"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: renders real media with ffmpeg"]
