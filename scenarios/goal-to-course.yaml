# Demo scenario: type a goal -> Eduverse builds the course.
#
# Selectors verified against the LIVE site 2026-08-08 (eduverse.one/th).
# The app ships no data-testid / id attributes on the goals form, so these are
# structural. If a render fails with "waiting for locator", re-check the live
# markup before editing anything else — the screenshot in the LINE alert shows
# the page as it was when the step timed out.
#
#   #email / #password        -> login form (ids confirmed on /th/login)
#   form button[type=submit]  -> login submit; the page ALSO has a language
#                                switcher of type=submit, so scope to the form
#   textarea[required]        -> the goal box: the only required textarea in
#                                the goals form (motivation/background are not)
name: goal-to-course
login: true
steps:
  - narration: "อยากเรียนอะไรสักอย่าง แต่ไม่รู้จะเริ่มตรงไหน"
    action: goto
    url: https://eduverse.one/th/goals
    timeout_ms: 60000

  # The goals page renders in one of TWO shapes, and the demo account flips
  # from the first to the second the moment it creates its first goal:
  #   0 goals  -> the form is auto-opened (goals/page.tsx:254 setShowForm(true))
  #              and there is NO "new goal" button (it renders only when the
  #              form is closed), so `textarea[required]` is present.
  #   1+ goals -> the form starts collapsed, so the textarea does NOT exist
  #              yet and the "ตั้งเป้าหมายกับคาวี" button is what's rendered.
  # A selector list covers both: Playwright's page.click() is non-strict and
  # takes the FIRST match in DOM order, so it clicks the button when the form
  # is collapsed and merely focuses the textarea when it is already open --
  # harmless, since the next step fills that same textarea. Verified against
  # both shapes in test_goals_page_selector_works_in_both_states.
  # (The goal cards are also <button>s, but :has-text scopes to this one.)
  - narration: "เปิดกล่องตั้งเป้าหมายกับพี่กวี"
    action: click
    selector: "button:has-text('ตั้งเป้าหมายกับคาวี'), textarea[required]"
    sound: click
    timeout_ms: 30000

  - narration: "แค่พิมพ์เป้าหมายที่อยากไปให้ถึง"
    action: type
    selector: "textarea[required]"
    text: "อ่านงบการเงินเป็นภายใน 3 เดือน"
    sound: keystroke
    timeout_ms: 30000

  - narration: "กดสร้าง แล้วรอแป๊บเดียว"
    action: click
    selector: "form button[type=submit]"
    sound: click
    timeout_ms: 30000

  # Verified from a real render's failure screenshot (2026-08-08): submitting a
  # goal produces Kavee's personal reply plus a numbered learning plan — NOT a
  # course link. Courses are created per step afterwards, so waiting on
  # a[href*='/courses/'] here times out even though the demo worked.
  - narration: "พี่กวีทักกลับทันที พร้อมวางแผนการเรียนให้เป็นขั้นๆ"
    action: wait_for
    selector: "button:has-text('สร้างคอร์สขั้นนี้')"
    fit: speedup
    timeout_ms: 180000

  - narration: "เลือกขั้นที่อยากเริ่ม แล้วลงมือเรียนได้เลย"
    action: scroll
    selector: "button:has-text('สร้างคอร์สขั้นนี้')"
    fit: hold
    timeout_ms: 30000
